name: Fork CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan QA lanes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A PR's merge ref has the base tip as its first parent, so depth 2 is enough for
          # fast selection against HEAD^1; --require-base fails loudly if it is missing.
          fetch-depth: 2
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.17
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-plan
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - name: Choose routine or deep QA
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: node .github/scripts/qa-mode.cjs >> "$GITHUB_OUTPUT"
      - name: Distribute the selected QA work across lanes
        id: plan
        env:
          QA_MODE: ${{ steps.mode.outputs.mode }}
          QA_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.sha }}
        run: mise run ci:plan

  run:
    name: ${{ matrix.id }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      QA_PLAN: ${{ needs.plan.outputs.plan }}
      QA_JOB: ${{ matrix.id }}
      # The tests that compare flushes with Git's under `strace` must run here, so a runner that can't trace fails
      # them instead of skipping them.
      GIX_TEST_REQUIRE_STRACE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ matrix.history && '0' || '1' }}
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.17
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ matrix.cache }}
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - name: Install test dependencies
        env:
          NEEDS_XZ: ${{ matrix.xz }}
        run: |
          packages=(strace)
          if [[ "$NEEDS_XZ" == "true" ]]; then
            packages+=(liblzma-dev)
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
      - name: Run the lane
        run: mise run ci:job

  required:
    # The only check the dev ruleset requires.
    name: Fork CI required
    needs: [plan, run, msrv]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Require the planner, every lane and MSRV to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node .github/scripts/require-success.cjs

  msrv:
    name: Fork MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.17
      - run: mise run check:msrv
