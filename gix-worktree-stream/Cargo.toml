lints.workspace = true

[package]
name = "gix-worktree-stream"
version.workspace = true
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "generate a byte-stream from a git-tree"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.88"
include = ["/src/**/*", "/LICENSE-*"]
publish.workspace = true

[lib]
doctest = false

[features]
## Enable support for the SHA-1 hash by forwarding the feature to dependencies.
sha1 = ["gix-hash/sha1"]
## Enable support for the SHA-256 hash by forwarding the feature to dependencies.
sha256 = ["gix-hash/sha256"]

[dependencies]
gix-trace = { path = "../gix-trace" }
gix-utils = { path = "../gix-utils", features = ["io-pipe"] }
gix-hash = { path = "../gix-hash" }
gix-object = { path = "../gix-object" }
gix-attributes = { path = "../gix-attributes" }
gix-parallel = { path = "../gix-parallel", features = ["parallel"] }
gix-filter = { path = "../gix-filter" }
gix-traverse = { path = "../gix-traverse" }
gix-fs = { path = "../gix-fs", features = ["unstable"] }
gix-path = { path = "../gix-path" }

gix-error = { path = "../gix-error" }
parking_lot = "0.12.4"

[dev-dependencies]
insta = "1.46.3"
gix-worktree-stream = { path = ".", features = ["sha1", "sha256"] }
gix-testtools = { path = "../tests/tools" }
gix-hash = { path = "../gix-hash" }
gix-odb = { path = "../gix-odb" }
gix-worktree = { path = "../gix-worktree", default-features = false, features = ["attributes"] }

[package.metadata.docs.rs]
features = ["sha1"]

[package.metadata.cargo-machete]
# Enables thread-safe attribute and filter types passed to the stream's worker thread.
ignored = ["gix-parallel"]

[package.metadata.qa]
tests = [
    { args = [], env = { GIX_TEST_FIXTURE_HASH = "sha1" } },
    { args = ["--features", "sha256"], env = { GIX_TEST_FIXTURE_HASH = "sha256" } },
]
