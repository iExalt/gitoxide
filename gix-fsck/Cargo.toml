lints.workspace = true

[package]
name = "gix-fsck"
version.workspace = true
repository = "https://github.com/GitoxideLabs/gitoxide"
authors = ["Cameron Esfahani <cesfahani@gmail.com>", "Sebastian Thiel <sebastian.thiel@icloud.com>"]
license = "MIT OR Apache-2.0"
description = "Verifies the connectivity and validity of objects in the database"
edition = "2024"
include = ["/src/**/*", "/LICENSE-*"]
rust-version = "1.88"
publish.workspace = true

[lib]
doctest = false

[features]
## Enable support for the SHA-1 hash by forwarding the feature to dependencies.
sha1 = ["gix-hash/sha1"]
## Enable support for the SHA-256 hash by forwarding the feature to dependencies.
sha256 = ["gix-hash/sha256"]

[dependencies]
gix-error = { path = "../gix-error" }
gix-hash = { path = "../gix-hash" }
gix-hashtable = { path = "../gix-hashtable" }
gix-object = { path = "../gix-object" }

[dev-dependencies]
gix-odb = { path = "../gix-odb", features = ["sha1", "sha256"] }
gix-testtools = { path = "../tests/tools" }

[package.metadata.docs.rs]
features = ["sha1"]

[package.metadata.qa]
tests = [
    { args = [], env = { GIX_TEST_FIXTURE_HASH = "sha1" } },
    { args = ["--features", "sha256"], env = { GIX_TEST_FIXTURE_HASH = "sha256" } },
]
