lints.workspace = true

[package]
name = "gix-odb"
version.workspace = true
repository = "https://github.com/GitoxideLabs/gitoxide"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
license = "MIT OR Apache-2.0"
description = "Implements various git object databases"
edition = "2024"
include = ["/src/**/*", "/LICENSE-*"]
rust-version = "1.88"
autotests = false
publish.workspace = true

[lib]
doctest = true

[features]
## Enable support for the SHA-1 hash by enabling the respective feature in the `gix-hash` crate.
sha1 = ["gix-hash/sha1", "gix-pack/sha1"]
## Enable support for the SHA-256 hash by enabling the respective feature in the `gix-hash` crate.
sha256 = ["gix-hash/sha256", "gix-pack/sha256"]
## Data structures implement `serde::Serialize` and `serde::Deserialize`.
serde = ["dep:serde", "gix-hash/serde", "gix-object/serde", "gix-pack/serde"]
## Provide the `quarantine` module to receive packs the way `git receive-pack` does. It writes packs, which isn't possible when targeting WASM.
quarantine = ["gix-pack/streaming-input", "dep:filetime"]

[dependencies]
crc32fast = "1.5.0"
gix-trace = { path = "../gix-trace" }
gix-utils = { path = "../gix-utils", features = ["progress"] }
gix-parallel = { path = "../gix-parallel" }
gix-error = { path = "../gix-error" }
gix-zlib = { path = "../gix-zlib" }
gix-hashtable = { path = "../gix-hashtable" }
gix-hash = { path = "../gix-hash" }
gix-path = { path = "../gix-path" }
gix-quote = { path = "../gix-quote" }
gix-object = { path = "../gix-object" }
gix-pack = { path = "../gix-pack", default-features = false }
gix-fs = { path = "../gix-fs", features = ["walkdir", "unstable"] }
serde = { version = "1.0.114", optional = true, default-features = false, features = [
    "derive",
] }

tempfile = "3.26.0"
filetime = "0.2.29"
parking_lot = { version = "0.12.4" }
arc-swap = "1.9.0"
memmap2 = "0.9.11"
filetime = { version = "0.2.29", optional = true }

document-features = { version = "0.2.0", optional = true }

[dev-dependencies]
insta = "1.46.3"
gix-odb = { path = ".", features = ["sha1", "sha256", "quarantine"] }
gix-hash = { path = "../gix-hash" }
gix-testtools = { path = "../tests/tools", default-features = false, features = ["sha1", "sha256"] }
gix-date = { path = "../gix-date" }
gix-pack = { path = "../gix-pack", features = ["sha1"] }
gix-actor = { path = "../gix-actor" }
pretty_assertions = "1.0.0"
maplit = "1.0.2"
crossbeam-channel = "0.5.15"

[[test]]
name = "odb"
path = "tests/odb/main.rs"

[[test]]
name = "threaded"
path = "tests/threaded.rs"
required-features = ["gix-parallel/parallel"]

[package.metadata.docs.rs]
features = ["sha1", "document-features", "serde"]

[package.metadata.qa]
checks = [
    { args = ["--features", "sha1,serde"] },
    { args = ["--features", "sha1,quarantine"] },
]
tests = [
    { args = ["--all-features", "--features", "gix-parallel/parallel"] },
    { args = ["--features", "gix-parallel/parallel"] },
    { args = [], env = { GIX_TEST_FIXTURE_HASH = "sha1" } },
    { args = [], env = { GIX_TEST_FIXTURE_HASH = "sha256" } },
    # Cover the threaded regression under SHA-256; SHA-1 is covered above.
    { args = ["--features", "gix-parallel/parallel"], env = { GIX_TEST_FIXTURE_HASH = "sha256" } },
]
