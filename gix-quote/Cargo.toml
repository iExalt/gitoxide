lints.workspace = true

[package]
name = "gix-quote"
version.workspace = true
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project dealing with various quotations used by git"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.88"
include = ["/src/**/*", "/LICENSE-*"]
publish.workspace = true

[lib]
doctest = true

[dependencies]
gix-utils = { path = "../gix-utils" }

bstr = { version = "1.12.0", default-features = false, features = ["std"] }
gix-error = { path = "../gix-error", features = ["bstr"] }

[package.metadata.qa.wasm]
targets = ["wasm32-unknown-unknown", "wasm32-wasip1", "wasm32-wasip2"]
