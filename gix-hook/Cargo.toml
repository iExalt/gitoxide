lints.workspace = true

[package]
name = "gix-hook"
version.workspace = true
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project to locate and run Git hooks"
edition = "2024"
rust-version = "1.88"
include = ["/src/*.rs", "/LICENSE-*"]
publish.workspace = true

[lib]
doctest = false

[features]
## Enable support for the SHA-1 hash by forwarding the feature to dependencies.
sha1 = ["gix-config/sha1"]
## Enable support for the SHA-256 hash by forwarding the feature to dependencies.
sha256 = ["gix-config/sha256"]

[dependencies]
gix-command = { path = "../gix-command" }
gix-config = { path = "../gix-config" }
gix-error = { path = "../gix-error" }
gix-path = { path = "../gix-path" }

bstr = { version = "1.12.0", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.2", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
gix-testtools = { path = "../tests/tools", features = ["sha1"] }

[package.metadata.docs.rs]
features = ["sha1"]

[package.metadata.qa]
tests = [
    { args = ["--features", "sha1"], env = { GIX_TEST_FIXTURE_HASH = "sha1" } },
    { args = ["--features", "sha256"], env = { GIX_TEST_FIXTURE_HASH = "sha256" } },
]

[package.metadata.qa.wasm]
targets = ["wasm32-unknown-unknown", "wasm32-wasip1", "wasm32-wasip2"]
