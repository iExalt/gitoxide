lints.workspace = true

[package]
name = "gix-transport"
version.workspace = true
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project dedicated to implementing the git transport layer"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
include = ["/src/**/*", "/LICENSE-*"]
rust-version = "1.88"
publish.workspace = true

[lib]
doctest = false

[features]
default = []

## If set, blocking implementations of the typical git transports become available in `crate::client::blocking_io`
blocking-client = ["gix-packetline/blocking-io"]
## Implies `blocking-client`, and adds support for the http and https transports.
http-client = [
    "base64",
    "parking_lot",
    "gix-utils/io-pipe",
    "blocking-client",
    "gix-credentials",
]
## Implies `http-client`, and adds support for the http and https transports using the Rust bindings for `libcurl`.
##
## If used in conjunction with other blocking implementations like `http-client-reqwest`, this one takes precedence.
http-client-curl = ["curl", "http-client"]
## Implies `http-client-curl` and enables `rustls` for creating `https://` connections.
## If used in conjunction with `http-client-curl-openssl`, this feature will take precedence.
http-client-curl-rust-tls = ["http-client-curl", "curl/rustls"]
## Implies `http-client-curl` and enables `ssl` for creating `https://` connections.
## If used in conjunction with `http-client-curl-rust-tls`, the `rust-tls` feature will take precedence.
http-client-curl-openssl = ["http-client-curl", "curl/ssl"]
## Implies `http-client` and adds support for http transports using the blocking version of `reqwest`.
## NOTE: `https://` is NOT supported by default. You must enable one of the `http-client-reqwest-rust-tls`
## or `http-client-reqwest-native-tls` features to enable HTTPS support.
http-client-reqwest = ["reqwest", "http-client", "dep:tokio", "dep:futures-core"]
## Stacks with `http-client-reqwest` and enables `https://` via the `rustls` crate.
http-client-reqwest-rust-tls = ["http-client-reqwest", "reqwest/rustls"]
## Stacks with `http-client-reqwest` and enables `https://` via the `rustls` crate with the `ring` crypto provider instead of
## the `aws-lc-rs` one of `http-client-reqwest-rust-tls`, which builds faster and links less code. The provider is installed as the
## process-wide default of `rustls` when the first client is created, unless the application did so before. An application
## that wants another provider has to install it before the first request, as installing one twice fails.
http-client-reqwest-rust-tls-ring = ["http-client-reqwest", "reqwest/rustls-no-provider", "dep:rustls"]
## Stacks with `http-client-reqwest` and enables `https://` via the `rustls` crate.
## This also makes use of `trust-dns` to avoid `getaddrinfo`, but note it comes with its own problems.
http-client-reqwest-rust-tls-trust-dns = [
    "http-client-reqwest",
    "reqwest/rustls",
    "reqwest/hickory-dns",
]
## Stacks with `http-client-reqwest` and enables `https://` via the `native-tls` crate.
http-client-reqwest-native-tls = ["http-client-reqwest", "reqwest/native-tls"]
## Allows sending credentials over cleartext HTTP. For testing purposes only.
http-client-insecure-credentials = []
## If set, an async implementations of the git transports becomes available in `crate::client::async_io`.
## Suitable for implementing your own transports while using git's way of communication, typically in conjunction with a custom server.
## **Note** that the _blocking_ client has a wide range of available transports, with the _async_ version of it supporting only the TCP based `git` transport leaving you
## with the responsibility to providing such an implementation of `futures-io::AsyncRead/AsyncWrite` yourself.
async-client = [
    "gix-packetline/async-io",
    "async-trait",
    "futures-lite",
    "futures-io",
    "pin-project-lite",
]

#! ### Other
## Data structures implement `serde::Serialize` and `serde::Deserialize`.
serde = ["dep:serde", "bstr/serde"]

[[test]]
name = "blocking-transport"
path = "tests/blocking-transport.rs"
required-features = ["blocking-client", "http-client-insecure-credentials"]

[[test]]
name = "blocking-transport-http-only"
path = "tests/blocking-transport-http.rs"
required-features = ["http-client-curl", "http-client-insecure-credentials"]

[[test]]
name = "blocking-transport-http-reqwest"
path = "tests/blocking-transport-http-reqwest.rs"
required-features = ["http-client-reqwest"]

[[test]]
name = "async-transport"
path = "tests/async-transport.rs"
required-features = ["async-client"]

[dependencies]
gix-trace = { path = "../gix-trace" }
gix-utils = { path = "../gix-utils", features = ["bstr"] }
gix-command = { path = "../gix-command" }
gix-error = { path = "../gix-error" }
gix-path = { path = "../gix-path" }
gix-url = { path = "../gix-url" }
gix-sec = { path = "../gix-sec" }
gix-packetline = { path = "../gix-packetline" }
gix-credentials = { path = "../gix-credentials", optional = true }
gix-quote = { path = "../gix-quote" }

serde = { version = "1.0.114", optional = true, default-features = false, features = [
    "std",
    "derive",
] }
bstr = { version = "1.12.0", default-features = false, features = [
    "std",
    "unicode",
] }
parking_lot = { version = "0.12.4", optional = true }

# for async-client
async-trait = { version = "0.1.51", optional = true }
futures-io = { version = "0.3.32", optional = true }
futures-lite = { version = "2.1.0", optional = true }
pin-project-lite = { version = "0.2.6", optional = true }

# for http-client
base64 = { version = "0.22.1", optional = true }

# for http-client-curl. Additional configuration should be performed on higher levels of the dependency tree.
curl = { version = "0.4", optional = true, default-features = false }

# for http-client-reqwest
# all but the 'default-tls' feature
reqwest = { version = "0.13.4", optional = true, default-features = false, features = ["stream", "charset", "http2", "socks"] }
tokio = { version = "1.54", optional = true, default-features = false, features = ["rt", "time", "sync", "macros"] }
futures-core = { version = "0.3.32", optional = true, default-features = false }
# for http-client-reqwest-rust-tls-ring, which has to name the provider as `reqwest` doesn't bring one
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }

## If used in conjunction with `async-client`, the `connect()` method will become available along with supporting the git protocol over TCP,
## where the TCP stream is created using this crate.
async-std = { version = "1.12.0", optional = true }

document-features = { version = "0.2.0", optional = true }

[dev-dependencies]
gix-testtools = { path = "../tests/tools", default-features = false, features = ["sha1", "sha256"] }
insta = "1.46.3"
gix-transport = { path = ".", features = ["parking_lot"] }
gix-pack = { path = "../gix-pack", default-features = false, features = [
    "sha1",
    "sha256",
    "streaming-input",
] }
gix-hash = { path = "../gix-hash", features = ["sha1", "sha256"] }
async-std = { version = "1.9.0", features = ["attributes"] }
gix-macros = { path = "../gix-macros" }
blocking = "1.6.2"

[package.metadata.docs.rs]
features = ["http-client-curl", "document-features", "serde"]

[package.metadata.qa]
checks = [
    { args = ["--all-features"] },
    { args = ["--features", "blocking-client"] },
    { args = ["--features", "async-client"] },
    { args = ["--features", "async-client,async-std"] },
    { args = ["--features", "http-client"] },
    { args = ["--features", "http-client-curl"] },
    { args = ["--features", "http-client-reqwest"] },
]
tests = [
    { args = ["--features", "http-client-curl"] },
    { args = ["--features", "http-client-curl,http-client-insecure-credentials", "--test", "blocking-transport-http-only"] },
    { args = ["--features", "http-client-reqwest"] },
    { args = ["--no-default-features", "--features", "blocking-client,http-client-reqwest,http-client-insecure-credentials", "--test", "blocking-transport"] },
    { args = ["--features", "async-client"] },
    # As of 2026-10-13, only `handshake_v1_and_request` and
    # `handshake_v2_and_request` have been made `GIX_TEST_FIXTURE_HASH`-aware.
    { args = ["--features", "blocking-client,http-client-insecure-credentials", "--test", "blocking-transport", "-E", "test(handshake_v1_and_request) | test(handshake_v2_and_request)"], env = { GIX_TEST_FIXTURE_HASH = "sha1" } },
    { args = ["--features", "blocking-client,http-client-insecure-credentials", "--test", "blocking-transport", "-E", "test(handshake_v1_and_request) | test(handshake_v2_and_request)"], env = { GIX_TEST_FIXTURE_HASH = "sha256" } },
    { args = ["--features", "async-client", "--test", "async-transport", "-E", "test(handshake_v1_and_request) | test(handshake_v2_and_request)"], env = { GIX_TEST_FIXTURE_HASH = "sha1" } },
    { args = ["--features", "async-client", "--test", "async-transport", "-E", "test(handshake_v1_and_request) | test(handshake_v2_and_request)"], env = { GIX_TEST_FIXTURE_HASH = "sha256" } },
]
