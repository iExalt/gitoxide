lints.workspace = true

[package]
name = "gix-credentials"
version.workspace = true
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project to interact with git credentials helpers"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.99"
include = ["/src/**/*", "/LICENSE-*"]
publish.workspace = true

[lib]
doctest = false

[features]
## Data structures implement `serde::Serialize` and `serde::Deserialize`.
serde = ["dep:serde", "bstr/serde", "gix-sec/serde"]

[dependencies]
gix-sec = { path = "../gix-sec" }
gix-error = { path = "../gix-error", features = ["bstr"] }
gix-url = { path = "../gix-url" }
gix-path = { path = "../gix-path" }
gix-quote = { path = "../gix-quote" }
gix-command = { path = "../gix-command" }
gix-config-value = { path = "../gix-config-value" }
gix-prompt = { path = "../gix-prompt" }
gix-date = { path = "../gix-date" }
gix-trace = { path = "../gix-trace" }
gix-lock = { path = "../gix-lock" }

serde = { version = "1.0.114", optional = true, default-features = false, features = ["derive"] }
bstr = { version = "1.12.0", default-features = false, features = ["std"] }
percent-encoding = "2.3.1"



document-features = { version = "0.2.1", optional = true }

[dev-dependencies]
insta = "1.46.3"
gix-sec = { path = "../gix-sec" }
gix-testtools = { path = "../tests/tools", features = ["sha1"] }

[package.metadata.docs.rs]
all-features = true
features = ["document-features"]

[package.metadata.cargo-machete]
ignored = [
    # Public optional `serde` feature is retained for downstream feature compatibility.
    "serde",
]

[package.metadata.qa]
checks = [
    { args = ["--features", "serde"] },
]
