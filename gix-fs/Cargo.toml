lints.workspace = true

[package]
name = "gix-fs"
version.workspace = true
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate providing file system specific utilities to `gitoxide`"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.99"
include = ["/src/**/*", "/LICENSE-*"]
publish.workspace = true

[lib]
doctest = true

[features]
## Expose filesystem APIs beyond stable lock-file creation, cleanup, and permission handling. Restrict updates to the same minor series when using them.
unstable = []

## The experimental `Capabilities` type implements `serde::Serialize` and `serde::Deserialize`.
serde = ["unstable", "dep:serde"]

## Enable experimental recursive directory traversal with optional Unicode precomposition and Git-style sorting using the `walkdir` crate.
walkdir = ["unstable", "dep:walkdir"]

[package.metadata.smart-release]
api-check = ["etc/scripts/check-api.sh"]
unstable-features = ["unstable", "serde", "walkdir"]

[package.metadata.api-check]
profiles = [{ default-features = false, features = [] }]
allowed-unstable-crates = ["gix_error"]

[dependencies]
gix-macros = { path = "../gix-macros" }
gix-parallel = { path = "../gix-parallel" }
bstr = "1.12.0"
gix-path = { path = "../gix-path" }
gix-utils = { path = "../gix-utils" }
gix-error = { path = "../gix-error" }

serde = { version = "1.0.114", optional = true, default-features = false, features = [
    "std",
    "derive",
] }
walkdir = { version = "2.3.2", optional = true }

document-features = { version = "0.2.0", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.186" }

[dev-dependencies]
gix-fs = { path = ".", features = ["unstable"] }
gix-testtools = { path = "../tests/tools", default-features = false, features = [
    "sha1",
] }
insta = "1.46.3"
crossbeam-channel = "0.5.15"
is_ci = "1.1.1"
tempfile = "3.26.0"

[package.metadata.docs.rs]
all-features = true
features = ["document-features"]

[package.metadata.qa]
checks = [
    { args = ["--no-default-features"] },
    { args = ["--features", "walkdir"] },
    { args = ["--all-features"] },
]
tests = [
    { args = ["--all-features"] },
]
