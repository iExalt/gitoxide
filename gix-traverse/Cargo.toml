lints.workspace = true

[package]
name = "gix-traverse"
version.workspace = true
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
include = ["/src/**/*", "/LICENSE-*"]
rust-version = "1.88"
publish.workspace = true

[lib]
doctest = false

[features]
## Enable support for the SHA-1 hash by enabling the respective feature in the `gix-hash` crate.
sha1 = ["gix-hash/sha1"]
## Enable support for the SHA-256 hash by enabling the respective feature in the `gix-hash` crate.
sha256 = ["gix-hash/sha256"]

[dependencies]
gix-hash = { path = "../gix-hash" }
gix-error = { path = "../gix-error" }
gix-object = { path = "../gix-object" }
gix-date = { path = "../gix-date" }
gix-hashtable = { path = "../gix-hashtable" }
gix-revwalk = { path = "../gix-revwalk" }
gix-commitgraph = { path = "../gix-commitgraph" }
smallvec = "1.15.1"
bitflags = "2"

[dev-dependencies]
gix-traverse = { path = ".", features = ["sha1", "sha256"] }
gix-testtools = { path = "../tests/tools", default-features = false, features = ["sha1", "sha256"] }
gix-odb = { path = "../gix-odb" }
gix-object = { path = "../gix-object" }
gix-commitgraph = { path = "../gix-commitgraph" }
gix-path = { path = "../gix-path" }
insta = "1.46.3"

[package.metadata.docs.rs]
features = ["sha1"]

[package.metadata.qa]
tests = [
    { args = [], env = { GIX_TEST_FIXTURE_HASH = "sha1" } },
    { args = [], env = { GIX_TEST_FIXTURE_HASH = "sha256" } },
]

[package.metadata.qa.wasm]
targets = ["wasm32-unknown-unknown", "wasm32-wasip1", "wasm32-wasip2"]
checks = [
    { args = ["--features", "sha1"] },
]
