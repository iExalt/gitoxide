lints.workspace = true

[package]
name = "gix-worktree-state"
version.workspace = true
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project implementing setting the worktree to a particular state"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
include = ["/src/**/*", "/LICENSE-*"]
rust-version = "1.88"
publish.workspace = true

[lib]
doctest = false

[features]
## Enable support for the SHA-1 hash by forwarding the feature to dependencies.
sha1 = ["gix-index/sha1"]
## Enable support for the SHA-256 hash by forwarding the feature to dependencies.
sha256 = ["gix-index/sha256"]

[dependencies]
gix-trace = { path = "../gix-trace" }
gix-utils = { path = "../gix-utils", features = ["interrupt", "progress"] }
gix-parallel = { path = "../gix-parallel" }
gix-worktree = { path = "../gix-worktree", default-features = false, features = ["attributes"] }
gix-index = { path = "../gix-index" }
gix-fs = { path = "../gix-fs", features = ["unstable"] }
gix-object = { path = "../gix-object" }
gix-error = { path = "../gix-error", features = ["bstr"] }
gix-path = { path = "../gix-path" }
gix-filter = { path = "../gix-filter" }

io-close = "0.3.7"
bstr = { version = "1.12.0", default-features = false }

[dev-dependencies]
insta = "1.46.3"
gix-worktree-state = { path = ".", features = ["sha1", "sha256"] }
gix-object = { path = "../gix-object" }
gix-filter = { path = "../gix-filter" }
gix-index = { path = "../gix-index", features = ["sha1", "sha256"] }
gix-hash = { path = "../gix-hash", features = ["sha1", "sha256"] }
gix-fs = { path = "../gix-fs", features = ["unstable"] }
gix-testtools = { path = "../tests/tools", default-features = false, features = ["sha1", "sha256"] }
gix-odb = { path = "../gix-odb", features = ["sha1", "sha256"] }
walkdir = "2.3.2"

[package.metadata.docs.rs]
features = ["sha1"]

[package.metadata.qa]
tests = [
    { args = ["--features", "gix-parallel/parallel"], env = { GIX_TEST_FIXTURE_HASH = "sha1" } },
    { args = ["--features", "sha256,gix-parallel/parallel"], env = { GIX_TEST_FIXTURE_HASH = "sha256" } },
]
