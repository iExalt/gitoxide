lints.workspace = true

[package]
name = "gix-ref"
version.workspace = true
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate to handle git references"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
include = ["/src/**/*", "/LICENSE-*"]
rust-version = "1.88"
publish.workspace = true

[lib]
doctest = false
test = true

[[test]]
name = "threaded"
path = "tests/threaded.rs"
required-features = ["gix-parallel/parallel"]

[features]
## Enable support for the SHA-1 hash by enabling the respective feature in the `gix-hash` crate.
sha1 = ["gix-hash/sha1"]
## Enable support for the SHA-256 hash by enabling the respective feature in the `gix-hash` crate.
sha256 = ["gix-hash/sha256"]
## Data structures implement `serde::Serialize` and `serde::Deserialize`.
serde = ["dep:serde", "gix-hash/serde", "gix-actor/serde", "gix-object/serde"]

[dependencies]
gix-parallel = { path = "../gix-parallel" }
gix-error = { path = "../gix-error", features = ["bstr"] }
gix-fs = { path = "../gix-fs", features = [
    "walkdir",
    "unstable",
] }
gix-path = { path = "../gix-path" }
gix-hash = { path = "../gix-hash" }
gix-object = { path = "../gix-object" }
gix-utils = { path = "../gix-utils" }
gix-validate = { path = "../gix-validate" }
gix-actor = { path = "../gix-actor" }
gix-lock = { path = "../gix-lock" }

serde = { version = "1.0.114", optional = true, default-features = false, features = [
    "derive",
] }

# packed refs
memmap2 = "0.9.11"

document-features = { version = "0.2.1", optional = true }

[dev-dependencies]
gix-fs = { path = "../gix-fs", features = ["unstable"] }
gix-lock = { path = "../gix-lock", features = ["unstable"] }
gix-testtools = { path = "../tests/tools", default-features = false, features = ["sha1", "sha256"] }
gix-date = { path = "../gix-date" }
gix-hash = { path = "../gix-hash", features = ["sha1", "sha256"] }
gix-discover = { path = "../gix-discover" }
gix-odb = { path = "../gix-odb" }
insta = "1.46.3"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.186"

[package.metadata.docs.rs]
features = ["sha1", "document-features", "serde"]

[package.metadata.qa]
tests = [
    { args = ["--all-features", "--features", "gix-parallel/parallel"], env = { GIX_TEST_FIXTURE_HASH = "sha1" } },
    { args = ["--all-features", "--features", "gix-parallel/parallel"], env = { GIX_TEST_FIXTURE_HASH = "sha256" } },
]
