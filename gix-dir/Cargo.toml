lints.workspace = true

[package]
name = "gix-dir"
version.workspace = true
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project dealing with directory walks"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.99"
include = ["/src/**/*", "/LICENSE-*"]
publish.workspace = true

[lib]
doctest = false
test = false

[features]
## Enable support for the SHA-1 hash by forwarding the feature to dependencies.
sha1 = ["gix-index/sha1", "gix-worktree/sha1"]
## Enable support for the SHA-256 hash by forwarding the feature to dependencies.
sha256 = ["gix-index/sha256", "gix-worktree/sha256"]

[dependencies]
gix-error = { path = "../gix-error" }
gix-trace = { path = "../gix-trace" }
gix-index = { path = "../gix-index" }
gix-discover = { path = "../gix-discover" }
gix-fs = { path = "../gix-fs", features = ["unstable"] }
gix-path = { path = "../gix-path" }
gix-pathspec = { path = "../gix-pathspec" }
gix-worktree = { path = "../gix-worktree", default-features = false }
gix-object = { path = "../gix-object" }
gix-ignore = { path = "../gix-ignore" }
gix-utils = { path = "../gix-utils", features = ["bstr"] }

bstr = { version = "1.12.0", default-features = false }

[dev-dependencies]
insta = "1.46.3"
gix-dir = { path = ".", features = ["sha1", "sha256"] }
gix-testtools = { path = "../tests/tools" }
gix-fs = { path = "../gix-fs", features = ["unstable"] }
pretty_assertions = "1.4.0"

[package.metadata.docs.rs]
features = ["sha1"]

[package.metadata.qa]
tests = [
    { args = [], env = { GIX_TEST_FIXTURE_HASH = "sha1" } },
    { args = ["--features", "sha256"], env = { GIX_TEST_FIXTURE_HASH = "sha256" } },
]
