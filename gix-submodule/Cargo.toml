lints.workspace = true

[package]
name = "gix-submodule"
version.workspace = true
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project dealing git submodules"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.88"
include = ["/src/**/*", "/LICENSE-*"]
publish.workspace = true

[lib]
doctest = false

[features]
## Enable support for the SHA-1 hash by forwarding the feature to dependencies.
sha1 = ["gix-refspec/sha1"]
## Enable support for the SHA-256 hash by forwarding the feature to dependencies.
sha256 = ["gix-refspec/sha256"]

[dependencies]
gix-pathspec = { path = "../gix-pathspec" }
gix-error = { path = "../gix-error", features = ["bstr"] }
gix-refspec = { path = "../gix-refspec" }
gix-config = { path = "../gix-config" }
gix-path = { path = "../gix-path" }
gix-url = { path = "../gix-url" }

bstr = { version = "1.12.0", default-features = false }

[dev-dependencies]
insta = "1.46.3"
gix-testtools = { path = "../tests/tools" }
gix-fs = { path = "../gix-fs", features = ["walkdir", "unstable"] }

[package.metadata.docs.rs]
features = ["sha1"]
