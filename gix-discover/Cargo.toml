lints.workspace = true

[package]
name = "gix-discover"
version.workspace = true
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "Discover git repositories and check if a directory is a git repository"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
include = ["/src/**/*", "/LICENSE-*"]
rust-version = "1.99"
publish.workspace = true

[lib]
doctest = true

[features]
## Enable support for the SHA-1 hash by forwarding the feature to dependencies.
sha1 = ["gix-ref/sha1"]
## Enable support for the SHA-256 hash by forwarding the feature to dependencies.
sha256 = ["gix-ref/sha256"]

[dependencies]
gix-sec = { path = "../gix-sec" }
gix-path = { path = "../gix-path" }
gix-ref = { path = "../gix-ref" }
gix-fs = { path = "../gix-fs", features = ["unstable"] }
gix-error = { path = "../gix-error" }

bstr = { version = "1.12.0", default-features = false, features = ["std", "unicode"] }

[target.'cfg(windows)'.dependencies]
dunce = "1.0.3"

[dev-dependencies]
insta = "1.46.3"
gix-testtools = { path = "../tests/tools", features = ["sha1"] }
serial_test = { version = "3.4.0", default-features = false }
is_ci = "1.1.1"

[target.'cfg(target_os = "macos")'.dev-dependencies]
defer = "0.2.1"

[target.'cfg(any(unix, windows))'.dev-dependencies]
tempfile = "3.26.0"

[package.metadata.docs.rs]
features = ["sha1"]

[package.metadata.qa]
tests = [
    { args = ["--features", "sha1"], env = { GIX_TEST_FIXTURE_HASH = "sha1" } },
    { args = ["--features", "sha256"], env = { GIX_TEST_FIXTURE_HASH = "sha256" } },
]
