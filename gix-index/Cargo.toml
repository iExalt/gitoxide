lints.workspace = true

[package]
name = "gix-index"
version.workspace = true
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A work-in-progress crate of the gitoxide project dedicated implementing the git index file"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
include = ["/src/**/*", "/LICENSE-*", "/README.md"]
rust-version = "1.99"
publish.workspace = true


[lib]
doctest = false
test = true

[[bench]]
name = "from-tree"
harness = false
path = "./benches/from_tree.rs"

[features]
## Enable support for the SHA-1 hash by enabling the respective feature in the `gix-hash` crate.
sha1 = ["gix-hash/sha1"]
## Enable support for the SHA-256 hash by enabling the respective feature in the `gix-hash` crate.
sha256 = ["gix-hash/sha256"]
## Data structures implement `serde::Serialize` and `serde::Deserialize`.
serde = ["dep:serde", "smallvec/serde", "gix-hash/serde"]

[dependencies]
gix-trace = { path = "../gix-trace" }
gix-parallel = { path = "../gix-parallel" }
gix-hash = { path = "../gix-hash" }
gix-error = { path = "../gix-error" }
gix-bitmap = { path = "../gix-bitmap" }
gix-object = { path = "../gix-object" }
gix-validate = { path = "../gix-validate" }
gix-traverse = { path = "../gix-traverse" }
gix-lock = { path = "../gix-lock" }
gix-fs = { path = "../gix-fs", features = ["unstable"] }
gix-utils = { path = "../gix-utils", features = [
    "progress",
] }

hashbrown = "0.17.1"
fnv = "1.0.7"
memmap2 = "0.9.11"
filetime = "0.2.29"
bstr = { version = "1.12.0", default-features = false }

serde = { version = "1.0.114", optional = true, default-features = false, features = [
    "derive",
] }
smallvec = "1.15.1"
itoa = "1.0.17"
bitflags = "2"

document-features = { version = "0.2.0", optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.2", default-features = false, features = [
    "std",
    "fs",
] }
libc = { version = "0.2.186" }

[dev-dependencies]
criterion = "0.8.2"
gix-testtools = { path = "../tests/tools", default-features = false, features = ["sha1", "sha256"] }
gix-hash = { path = "../gix-hash", features = ["sha1", "sha256"] }
gix-hashtable = { path = "../gix-hashtable" }
gix-odb = { path = "../gix-odb" }
gix-object = { path = "../gix-object" }
filetime = "0.2.29"
insta = { version = "1.46.3", features = ["filters"] }

[package.metadata.docs.rs]
features = ["sha1", "document-features", "serde"]

[package.metadata.qa]
checks = [
    { args = ["--features", "sha1,serde"] },
]
tests = [
    { args = ["--features", "gix-parallel/parallel"], env = { GIX_TEST_FIXTURE_HASH = "sha1" } },
    { args = ["--features", "gix-parallel/parallel"], env = { GIX_TEST_FIXTURE_HASH = "sha256" } },
]

[package.metadata.qa.wasm]
targets = ["wasm32-unknown-unknown", "wasm32-wasip1", "wasm32-wasip2"]
checks = [
    { args = ["--features", "sha1"] },
]
