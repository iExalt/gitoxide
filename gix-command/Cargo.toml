lints.workspace = true

[package]
name = "gix-command"
version.workspace = true
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project handling internal git command execution"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.88"
include = ["/src/*.rs", "/LICENSE-*"]
publish.workspace = true

[lib]
doctest = true

[dependencies]
gix-error = { path = "../gix-error" }
gix-trace = { path = "../gix-trace" }
gix-path = { path = "../gix-path" }
gix-quote = { path = "../gix-quote" }

bstr = { version = "1.12.0", default-features = false, features = ["std", "unicode"] }

[dev-dependencies]
insta = "1.46.3"
gix-testtools = { path = "../tests/tools", features = ["sha1"] }

[package.metadata.qa.wasm]
targets = ["wasm32-unknown-unknown", "wasm32-wasip1", "wasm32-wasip2"]
