lints.workspace = true

[package]
name = "gix-object"
version.workspace = true
description = "Immutable and mutable git objects with decoding and encoding support"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
edition = "2024"
include = ["/src/**/*", "/LICENSE-*"]
rust-version = "1.88"
publish.workspace = true

[lib]
doctest = true

[[bench]]
name = "decode-objects"
harness = false
path = "./benches/decode_objects.rs"

[[bench]]
name = "edit-tree"
harness = false
path = "./benches/edit_tree.rs"


[features]
## Enable commit and annotated-tag signing and signature verification with external programs.
signature = ["dep:gix-command", "dep:gix-path", "dep:gix-tempfile"]
## Enable support for the SHA-1 hash by enabling the respective feature in the `gix-hash` crate.
sha1 = ["gix-hash/sha1"]
## Enable support for the SHA-256 hash by enabling the respective feature in the `gix-hash` crate.
sha256 = ["gix-hash/sha256"]
## Data structures implement `serde::Serialize` and `serde::Deserialize`.
serde = [
    "dep:serde",
    "bstr/serde",
    "smallvec/serde",
    "gix-hash/serde",
    "gix-actor/serde",
]
[dependencies]
gix-hash = { path = "../gix-hash" }
gix-hashtable = { path = "../gix-hashtable" }
gix-validate = { path = "../gix-validate" }
gix-actor = { path = "../gix-actor" }
gix-date = { path = "../gix-date" }
gix-utils = { path = "../gix-utils", features = ["progress"] }
gix-command = { path = "../gix-command", optional = true }
gix-path = { path = "../gix-path", optional = true }
gix-error = { path = "../gix-error", features = ["bstr"] }
gix-tempfile = { path = "../gix-tempfile", optional = true }

itoa = "1.0.17"
bstr = { version = "1.12.0", default-features = false, features = [
    "std",
    "unicode",
] }
smallvec = { version = "1.15.1", features = ["write"] }
serde = { version = "1.0.114", optional = true, default-features = false, features = [
    "derive",
] }

document-features = { version = "0.2.0", optional = true }

[dev-dependencies]
gix-object = { path = ".", features = ["signature", "sha1", "sha256"] }
gix-hash = { path = "../gix-hash", features = ["bstr"] }
gix-testtools = { path = "../tests/tools", default-features = false }
gix-odb = { path = "../gix-odb" }
termtree = "1.0.0"
criterion = "0.8.2"
pretty_assertions = "1.0.0"
insta = "1.46.3"

[package.metadata.docs.rs]
all-features = true
features = ["sha1", "document-features"]

[package.metadata.qa]
checks = [
    { args = ["--all-features"] },
]
tests = [
    { args = [], env = { GIX_TEST_FIXTURE_HASH = "sha1" } },
    { args = [], env = { GIX_TEST_FIXTURE_HASH = "sha256" } },
]

[package.metadata.qa.wasm]
targets = ["wasm32-unknown-unknown", "wasm32-wasip1", "wasm32-wasip2"]
checks = [
    { args = ["--features", "sha1"] },
]
