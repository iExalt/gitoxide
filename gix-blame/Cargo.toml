lints.workspace = true

[package]
name = "gix-blame"
version.workspace = true
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project dedicated to implementing a 'blame' algorithm"
authors = ["Christoph Rüßler <christoph.ruessler@mailbox.org>", "Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.88"
include = ["/src/**/*", "/LICENSE-*"]
publish.workspace = true

[features]
## Enable support for the SHA-1 hash by forwarding the feature to dependencies.
sha1 = ["gix-hash/sha1"]
## Enable support for the SHA-256 hash by forwarding the feature to dependencies.
sha256 = ["gix-hash/sha256"]

[dependencies]
gix-error = { path = "../gix-error" }
gix-commitgraph = { path = "../gix-commitgraph" }
gix-revwalk = { path = "../gix-revwalk" }
gix-trace = { path = "../gix-trace" }
gix-date = { path = "../gix-date" }
gix-diff = { path = "../gix-diff", default-features = false, features = [
    "blob",
] }
gix-object = { path = "../gix-object" }
gix-hash = { path = "../gix-hash" }
gix-worktree = { path = "../gix-worktree", default-features = false, features = [
    "attributes",
] }
gix-traverse = { path = "../gix-traverse" }

smallvec = "1.15.1"

[dev-dependencies]
criterion = "0.8.2"
insta = "1.46.3"
gix-discover = { path = "../gix-discover", features = ["sha1", "sha256"] }
gix-hash = { path = "../gix-hash", features = ["sha1", "sha256"] }
gix-ref = { path = "../gix-ref", features = ["sha1", "sha256"] }
gix-filter = { path = "../gix-filter" }
gix-fs = { path = "../gix-fs", features = ["unstable"] }
gix-index = { path = "../gix-index", features = ["sha1"] }
gix-odb = { path = "../gix-odb", features = ["sha1"] }
gix-testtools = { path = "../tests/tools" }
pretty_assertions = "1.4.0"

[[bench]]
name = "blame"
harness = false

[package.metadata.docs.rs]
features = ["sha1"]

[package.metadata.qa]
tests = [
    { args = [], env = { GIX_TEST_FIXTURE_HASH = "sha1" } },
    { args = [], env = { GIX_TEST_FIXTURE_HASH = "sha256" } },
]
