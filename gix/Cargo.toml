lints.workspace = true

[package]
name = "gix"
repository = "https://github.com/GitoxideLabs/gitoxide"
description = "Interact with git repositories just like git would"
license = "MIT OR Apache-2.0"
version.workspace = true
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
include = ["/src/**/*", "/LICENSE-*"]
rust-version = "1.88"
publish.workspace = true

[lib]
doctest = true
test = true

[[example]]
name = "clone"
path = "examples/clone.rs"
required-features = ["blocking-network-client"]

[[example]]
name = "gix-notes-bench"
path = "examples/gix-notes-bench.rs"
required-features = ["notes"]

[features]

default = [
    "max-performance",
    "comfort",
    "basic",
    "extras",
    "auto-chain-error",
    "sha1",
    "reftable",
]

#! There are various categories of features which help to optimize performance and build times. `gix` comes with 'batteries included' and everything is
#! enabled as long as it doesn't sacrifice compatibility. Most users will be fine with that but will pay with higher compile times than necessary as they
#! probably don't use all of these features.
#!
#! **Thus it's recommended to take a moment and optimize build times by choosing only those 'Components' that you require.** *'Performance' relevant features should
#! be chosen next to maximize efficiency.*
#!
#! #### Application Developers
#!
#! These are considered the end-users, all they need to tune is `Performance` features to optimize the efficiency of their app, assuming they don't use `gix`
#! directly. Otherwise, see the `Library Developers` paragraph.
#!
#! In order to configure a crate that isn't a direct dependency, one has to make it a direct dependency. We recommend
#! `gix-for-configuration = { package = "gix", version = "X.Y.Z", features = […] }` to make clear this dependency isn't used in code.
#!
#! #### Library Developers
#!
#! As a developer of a library, you should start out with `gix = { version = "X.Y.Z", default-features = false }` and add components as you see fit.
#! Leave performance features to the application so it can choose its threading and cache configuration.
#!
#! #### Bundles
#!
#! A bundle is a set of related feature toggles which can be activated with a single name that acts as a group.
#! Bundles are for convenience only and bear no further meaning beyond the cargo manifest file.

## More fundamental components that most will be able to make good use of.
basic = ["blob-diff", "revision", "index"]

## Read and edit the references of repositories that store them as reftables, which Git selects with
## `extensions.refStorage = reftable`, and create such repositories if asked to like Git does, with `init.defaultRefFormat`,
## `GIT_DEFAULT_REF_FORMAT` or `feature.experimental`.
##
## Without it, such repositories can be opened and their objects used, but every operation on references fails with an
## `Unsupported` error, and creating one fails the same way. It adds `gix-reftable` and its dependencies.
reftable = ["gix-ref/reftable"]

## Various additional features and capabilities that are not necessarily part of what most users would need.
extras = [
    "worktree-stream",
    "worktree-archive",
    "revparse-regex",
    "mailmap",
    "excludes",
    "attributes",
    "worktree-mutation",
    "credentials",
    "interrupt",
    "status",
    "dirwalk",
    "blame",
    "merge",
    "notes",
    "maintenance",
]

## Various progress-related features that improve the look of progress message units.
comfort = ["progress-unit-bytes", "progress-unit-human-numbers"]
## Display progress counts with human-readable number units.
progress-unit-human-numbers = ["gix-utils/progress-unit-human-numbers"]
## Display byte sizes and progress with human-readable byte units.
progress-unit-bytes = ["gix-utils/progress-unit-bytes"]

#! #### Hashes
#!
#! Support for various hash algorithms is controlled here. The idea is to allow applications to
#! compile in only the ones they need, which is why within the entire `gix` stack there is no
#! crate that sets an algorithm, except for the top-level `gix` crate for convenience.
#!
#! At least one hash algorithm must be enabled for compilation to succeed.

## Enable support for the SHA-1 hash throughout the `gix` stack.
sha1 = [
    "gix-hash/sha1",
    "gix-pack/sha1",
    "gix-note?/sha1",
    "gix-hook?/sha1",
    "gix-worktree-stream?/sha1",
]

## Enable support for the SHA-256 hash throughout the `gix` stack.
sha256 = [
    "gix-hash/sha256",
    "gix-object/sha256",
    "gix-pack/sha256",
    "gix-note?/sha256",
    "gix-hook?/sha256",
    "gix-worktree-stream?/sha256",
]

#! #### Components
#!
#! A component is a distinct feature which may be comprised of one or more methods around a particular topic.
#! Providers of libraries should only activate the components they need.

## Provide a top-level `command` module that helps with spawning commands similarly to `git`.
command = ["dep:gix-command", "gix-object/signature"]

## Locate and run Git hooks, including those from `hook.*` configuration, with a top-level `hook` module and `Repository::hook()`.
hook = ["dep:gix-hook", "command"]

## Obtain information similar to `git status`.
status = ["gix-status", "dirwalk", "index", "blob-diff", "gix-diff/index"]

## Utilities for interrupting computations and cleaning up tempfiles.
interrupt = ["dep:signal-hook", "gix-tempfile/signals", "dep:parking_lot"]

## Access to `.git/index` files.
index = ["dep:gix-index"]

## Find what is still wanted in a repository, as a first step of removing what isn't, with a top-level `maintenance` module.
maintenance = ["index", "command", "gix-pack/generate", "gix-pack/streaming-input"]

## Support directory walks with Git-style annoations.
dirwalk = ["dep:gix-dir", "attributes", "excludes"]

## Access to credential helpers, which provide credentials for URLs.
# Note that `gix-negotiate` just piggibacks here, as 'credentials' is equivalent to 'fetch & push' right now.
credentials = ["dep:gix-credentials", "dep:gix-prompt", "dep:gix-negotiate"]

## Add, inspect, update, and remove worktrees.
worktree-mutation = [
    "status",
    "dep:gix-worktree-state",
    "gix-worktree/add",
    "gix-worktree/remove",
]

## Retrieve a worktree stack for querying exclude information
excludes = ["dep:gix-ignore", "dep:gix-worktree", "index"]

## Query attributes and excludes. Enables access to pathspecs, worktree checkouts, filter-pipelines and submodules.
attributes = [
    "excludes",
    "dep:gix-filter",
    "dep:gix-pathspec",
    "dep:gix-attributes",
    "dep:gix-submodule",
    "gix-worktree?/attributes",
    "command",
]

## Add support for mailmaps, as way of determining the final name of commmiters and authors.
mailmap = ["dep:gix-mailmap", "revision"]

## Read and mutate Git notes.
notes = ["dep:gix-note"]

## Make revspec parsing possible, as well describing revision.
revision = ["gix-revision/describe", "gix-revision/merge_base", "index"]

## If enabled, revspecs now support the regex syntax like `@^{/^.*x}`. Otherwise, only substring search is supported.
## This feature does increase compile time for niche-benefit, but is required for fully git-compatible revspec parsing.
revparse-regex = ["regex", "revision"]

## Make it possible to diff blobs line by line. Note that this feature is integral for implementing tree-diffs as well due to the handling of rename-tracking,
## which relies on line-by-line diffs in some cases.
blob-diff = ["gix-diff/blob", "attributes"]

## Add functions to specifically merge files, using the standard three-way merge that git offers.
merge = ["blob-diff", "dep:gix-merge", "attributes"]

## Add blame command similar to `git blame`.
blame = ["dep:gix-blame", "blob-diff"]

## Make it possible to turn a tree into a stream of bytes, which can be decoded to entries and turned into various other formats.
##
## Tree streaming always uses a background producer thread. This feature therefore enables `parallel`, also when
## activated through `worktree-archive`, keeping thread-safe shared types and locally gated parallel code paths consistent.
worktree-stream = ["gix-worktree-stream", "attributes", "parallel"]

## Create archives from a tree in the repository, similar to what `git archive` does.
##
## Note that we disable all default features which strips it off all container support, like `tar` and `zip`.
## Your application should add it as dependency and re-activate the desired features.
worktree-archive = ["gix-archive", "worktree-stream", "attributes"]

#! #### Mutually Exclusive Network Client
#!
#! Either `async-*` or `blocking-*` versions of these toggles may be enabled at a time.
#! For this reason, these must be chosen by the user of the library and can't be pre-selected.
#! Making a choice here also affects which crypto-library ends up being used.

## Make `gix-protocol` available along with an async client.
async-network-client = [
    "gix-protocol/async-client",
    "gix-pack/streaming-input",
    "dep:gix-transport",
    "attributes",
    "credentials",
]
## Use this if your crate uses `async-std` as runtime, and enable basic runtime integration when connecting to remote servers via the `git://` protocol.
async-network-client-async-std = [
    "async-std",
    "async-network-client",
    "gix-transport/async-std",
]
## Make `gix-protocol` available along with a blocking client, providing access to the `file://`, `git://` and `ssh://` transports.
blocking-network-client = [
    "gix-protocol/blocking-client",
    "gix-pack/streaming-input",
    "gix-pack/generate",
    "gix-revision/merge_base",
    "dep:gix-transport",
    "attributes",
    "credentials",
]
## Receive pushes into repositories on the local machine like `git receive-pack` does, without running Git and without network.
receive = ["gix-protocol/blocking-server", "gix-odb/quarantine", "gix-pack/streaming-input", "hook", "revision"]
## Stacks with `blocking-network-client` to provide support for HTTP/S using **curl**, and implies blocking networking as a whole, making the `https://` transport available.
blocking-http-transport-curl = [
    "blocking-network-client",
    "gix-transport/http-client-curl",
]
## Stacks with `blocking-http-transport-curl` and also enables the `rustls` backend to avoid `openssl`.
## This feature takes precedence over `http-client-curl-rust-ssl`.
blocking-http-transport-curl-rustls = [
    "blocking-http-transport-curl",
    "gix-transport/http-client-curl-rust-tls",
]
## Stacks with `blocking-http-transport-curl` and also enables the `openssl` backend.
blocking-http-transport-curl-openssl = [
    "blocking-http-transport-curl",
    "gix-transport/http-client-curl-openssl",
]
## Stacks with `blocking-network-client` to provide support for HTTP/S using **reqwest**, and implies blocking networking as a whole, making the `https://` transport available.
## Note that `reqwest`'s default features are not enabled, allowing custom configuration of e.g. the TLS backend by adding it as explicit dependency.
blocking-http-transport-reqwest = [
    "blocking-network-client",
    "gix-transport/http-client-reqwest",
]
## Stacks with `blocking-http-transport-reqwest` and enables `https://` via the `rustls` crate.
blocking-http-transport-reqwest-rust-tls = [
    "blocking-http-transport-reqwest",
    "gix-transport/http-client-reqwest-rust-tls",
]
## Stacks with `blocking-http-transport-reqwest` and enables `https://` via the `rustls` crate with the `ring` crypto provider,
## which builds faster and links less code than the `aws-lc-rs` provider of `blocking-http-transport-reqwest-rust-tls`.
## It becomes the process-wide default of `rustls` with the first request unless one is installed, so applications that want
## another provider have to install it before that.
blocking-http-transport-reqwest-rust-tls-ring = [
    "blocking-http-transport-reqwest",
    "gix-transport/http-client-reqwest-rust-tls-ring",
]
## Stacks with `blocking-http-transport-reqwest` and enables `https://` via the `rustls` crate.
## This also makes use of `trust-dns` to avoid `getaddrinfo`, but note it comes with its own problems.
blocking-http-transport-reqwest-rust-tls-trust-dns = [
    "blocking-http-transport-reqwest",
    "gix-transport/http-client-reqwest-rust-tls-trust-dns",
]
## Stacks with `blocking-http-transport-reqwest` and enables `https://` via the `native-tls` crate.
blocking-http-transport-reqwest-native-tls = [
    "blocking-http-transport-reqwest",
    "gix-transport/http-client-reqwest-native-tls",
]


#! #### Performance
#!
#! The reason these features exist is to allow optimization for compile time and optimize for compatibility by default. This means that some performance options around
#! ZIP might not compile on all platforms, so it depends on the end-user who compiles the application to chose these based on their needs.

## Activate features that maximize performance, like using threads, but leave everything else that might affect compatibility out to allow users more fine-grained
## control.
## No C toolchain is involved.
max-control = ["parallel", "pack-cache-lru-static", "pack-cache-lru-dynamic"]

## The tempfile registry uses a better implementation of a thread-safe hashmap, relying on an external crate.
## This may be useful when tempfiles are created and accessed in a massively parallel fashion and you know that this is indeed faster than
## the simpler implementation that is the default.
hp-tempfile-registry = ["gix-tempfile/hp-hashmap"]

## Make certain data structure threadsafe (or `Sync`) to facilitate multithreading. Further, many algorithms will now use multiple threads by default.
##
## If unset, most of `gix` can only be used in a single thread as data structures won't be `Send` anymore.
parallel = ["gix-parallel/parallel", "gix-pack/parallel"]

## Provide a fixed-size allocation-free LRU cache for packs. It's useful if caching is desired while keeping the memory footprint
## for the LRU-cache itself low.
pack-cache-lru-static = ["gix-pack/pack-cache-lru-static"]

## Provide a hash-map based LRU cache whose eviction is based a memory cap calculated from object data.
pack-cache-lru-dynamic = ["gix-pack/pack-cache-lru-dynamic"]

## Enable all features required for performance.
max-performance = ["max-control"]

## Decompress and compress objects with [`sirocco`](https://docs.rs/sirocco), which is faster than the
## default `zlib-rs` at both.
## This requires Rust 1.89 or newer.
zlib-sirocco = ["gix-zlib/sirocco"]

#! #### Other
#!
#! The catch-all of feature toggles.

## Print captured caller locations in error diagnostics, including errors returned from `main()`.
## Alternate formatting continues to omit locations. Locations are always available for inspection.
error-print-location = ["gix-error/error-print-location"]

## All [`gix::Error`](crate::Error) trees are flattened into chains for simple error-source chaining.
auto-chain-error = ["gix-error/auto-chain-error"]

## Allow [`gix::Exn`](crate::Exn) to convert directly into `anyhow::Error`.
anyhow = ["gix-error/anyhow"]

## The opposite of `auto-chain-error`. Use it to override `auto-chain-error`.
tree-error = ["gix-error/tree-error"]

## Enable tracing using the `tracing` crate for coarse tracing.
tracing = ["gix-trace/tracing"]

## Enable tracing using the `tracing` crate for detailed tracing. Also enables coarse tracing.
tracing-detail = ["gix-trace/tracing-detail", "tracing"]

## Data structures implement `serde::Serialize` and `serde::Deserialize`.
serde = [
    "dep:serde",
    "gix-pack/serde",
    "gix-object/serde",
    "gix-protocol/serde",
    "gix-transport?/serde",
    "gix-ref/serde",
    "gix-odb/serde",
    "gix-index?/serde",
    "gix-mailmap?/serde",
    "gix-url/serde",
    "gix-attributes?/serde",
    "gix-ignore?/serde",
    "gix-revision/serde",
    "gix-worktree?/serde",
    "gix-commitgraph/serde",
    "gix-credentials?/serde",
]

## Re-export the progress tree root which allows to obtain progress from various functions which take `impl gix::Progress`.
## Applications which want to display progress will probably need this implementation.
progress-tree = ["prodash/progress-tree"]

## Print debugging information about usage of object database caches, useful for tuning cache sizes.
cache-efficiency-debug = ["gix-utils/cache-efficiency-debug"]

[dependencies]
gix-parallel = { path = "../gix-parallel", features = [
    "once_cell",
] }
gix-error = { path = "../gix-error", features = ["bstr"] }
gix-utils = { path = "../gix-utils", features = [
    "bstr",
    "interrupt",
    "progress",
] }
gix-fs = { path = "../gix-fs", features = ["unstable"] }
gix-ref = { path = "../gix-ref" }
gix-discover = { path = "../gix-discover" }
gix-tempfile = { path = "../gix-tempfile", default-features = false }
gix-lock = { path = "../gix-lock" }
gix-validate = { path = "../gix-validate" }
gix-sec = { path = "../gix-sec" }
gix-date = { path = "../gix-date" }
gix-refspec = { path = "../gix-refspec" }
gix-filter = { path = "../gix-filter", optional = true }
gix-dir = { path = "../gix-dir", optional = true }

gix-config = { path = "../gix-config" }
gix-odb = { path = "../gix-odb" }
gix-zlib = { path = "../gix-zlib" }
gix-hash = { path = "../gix-hash" }
gix-shallow = { path = "../gix-shallow" }
gix-object = { path = "../gix-object" }
gix-actor = { path = "../gix-actor" }
gix-pack = { path = "../gix-pack", default-features = false, features = [
    "object-cache-dynamic",
] }
gix-revision = { path = "../gix-revision", default-features = false }
gix-revwalk = { path = "../gix-revwalk" }
gix-negotiate = { path = "../gix-negotiate", optional = true }

gix-path = { path = "../gix-path" }
gix-quote = { path = "../gix-quote" }
gix-url = { path = "../gix-url" }
gix-traverse = { path = "../gix-traverse" }
gix-diff = { path = "../gix-diff", default-features = false }
gix-merge = { path = "../gix-merge", default-features = false, optional = true }
gix-mailmap = { path = "../gix-mailmap", optional = true }
gix-note = { path = "../gix-note", optional = true }
gix-trace = { path = "../gix-trace" }

gix-glob = { path = "../gix-glob" }
gix-credentials = { path = "../gix-credentials", optional = true }
gix-prompt = { path = "../gix-prompt", optional = true }
gix-index = { path = "../gix-index", optional = true }
gix-attributes = { path = "../gix-attributes", optional = true }
gix-ignore = { path = "../gix-ignore", optional = true }
gix-worktree = { path = "../gix-worktree", optional = true, default-features = false }
gix-worktree-state = { path = "../gix-worktree-state", optional = true }
gix-hashtable = { path = "../gix-hashtable" }
gix-commitgraph = { path = "../gix-commitgraph" }
gix-pathspec = { path = "../gix-pathspec", optional = true }
gix-submodule = { path = "../gix-submodule", optional = true }
gix-status = { path = "../gix-status", optional = true, features = [
    "worktree-rewrites",
] }
gix-command = { path = "../gix-command", optional = true }
gix-hook = { path = "../gix-hook", optional = true }

gix-worktree-stream = { path = "../gix-worktree-stream", optional = true }
gix-archive = { path = "../gix-archive", default-features = false, optional = true }
gix-blame = { path = "../gix-blame", optional = true }

# For communication with remotes
gix-protocol = { path = "../gix-protocol" }
gix-transport = { path = "../gix-transport", optional = true }

# Just to get the progress-tree feature
prodash = { version = "31.0.1", optional = true, features = ["progress-tree"] }
signal-hook = { version = "0.4.3", default-features = false, optional = true }
nonempty = "0.12.0"
serde = { version = "1.0.114", optional = true, default-features = false, features = [
    "derive",
] }
smallvec = "1.15.1"
async-std = { version = "1.12.0", optional = true }

## For use in rev-parse, which provides searching commits by running a regex on their message.
##
## If disabled, the text will be search verbatim in any portion of the commit message, similar to
## how a simple unanchored regex of only 'normal' characters would work.
regex = { version = "1.12.3", optional = true, default-features = false, features = [
    "std",
] }

# for `interrupt` feature
parking_lot = { version = "0.12.4", optional = true }

document-features = { version = "0.2.0", optional = true }

[dev-dependencies]
gix-fs = { path = "../gix-fs", features = ["unstable"] }
gix-lock = { path = "../gix-lock", features = ["unstable"] }
gix-tempfile = { path = "../gix-tempfile", default-features = false, features = ["unstable"] }
gix = { path = ".", default-features = false, features = [
    "hook",
    "merge",
    "tree-error",
] }
gix-hash = { path = "../gix-hash" }
gix-pack = { path = "../gix-pack", default-features = false, features = [
    "generate",
    "streaming-input",
] }
pretty_assertions = "1.4.0"
gix-testtools = { path = "../tests/tools", features = ["sha1", "sha256"] }
# The peers of the `network` tests speak plain HTTP on the loopback interface, and credentials are only sent with this feature.
# Cargo unifies it into every test of `gix`, so tests can't rely on the refusal to send credentials in clear text.
gix-transport = { path = "../gix-transport", default-features = false, features = ["http-client-insecure-credentials"] }
is_ci = "1.1.1"
serial_test = { version = "3.4.0", default-features = false }
async-std = { version = "1.12.0", features = ["attributes"] }
termtree = "1.0.0"
insta = { version = "1.46.3", features = ["filters"] }

# The `network` tests terminate TLS with `rustls` and certificates they generate. The `ring` provider keeps the cost of
# compiling this low and is requested by name, so it can't conflict with another one that is enabled elsewhere.
[target.'cfg(unix)'.dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }

[[test]]
name = "network"
path = "tests/network/main.rs"
required-features = ["blocking-network-client"]

[package.metadata.docs.rs]
features = [
    "sha1",
    "document-features",
    "max-performance",
    "blocking-network-client",
    "blocking-http-transport-curl",
    "serde",
]

