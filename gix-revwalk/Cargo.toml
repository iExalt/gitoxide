lints.workspace = true

[package]
name = "gix-revwalk"
version.workspace = true
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate providing utilities for walking the revision graph"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
include = ["/src/**/*", "/LICENSE-*"]
rust-version = "1.99"
publish.workspace = true

[lib]
doctest = false

[features]
## Enable support for the SHA-1 hash by forwarding the feature to dependencies.
sha1 = ["gix-hash/sha1"]
## Enable support for the SHA-256 hash by forwarding the feature to dependencies.
sha256 = ["gix-hash/sha256"]

[dependencies]
gix-hash = { path = "../gix-hash" }
gix-error = { path = "../gix-error" }
gix-object = { path = "../gix-object" }
gix-date = { path = "../gix-date" }
gix-hashtable = { path = "../gix-hashtable" }
gix-commitgraph = { path = "../gix-commitgraph" }

smallvec = "1.15.1"

[dev-dependencies]
gix-testtools = { path = "../tests/tools", default-features = false }
gix-hash = { path = "../gix-hash", features = ["sha1", "sha256"] }

[package.metadata.docs.rs]
features = ["sha1"]
