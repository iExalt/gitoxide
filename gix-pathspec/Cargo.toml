lints.workspace = true

[package]
name = "gix-pathspec"
version.workspace = true
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project dealing magical pathspecs"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.99"
include = ["/src/**/*", "/LICENSE-*", "/README.md"]
publish.workspace = true

[lib]
doctest = true

[[test]]
name = "threaded"
path = "tests/threaded.rs"
required-features = ["gix-parallel/parallel"]

[dependencies]
gix-glob = { path = "../gix-glob" }
gix-path = { path = "../gix-path" }
gix-attributes = { path = "../gix-attributes" }
gix-config-value = { path = "../gix-config-value" }
gix-error = { path = "../gix-error", features = ["bstr"] }

bstr = { version = "1.12.0", default-features = false, features = ["std"] }
bitflags = "2"

[dev-dependencies]
insta = "1.46.3"
gix-parallel = { path = "../gix-parallel" }
gix-testtools = { path = "../tests/tools", default-features = false, features = ["repo-snapshot", "sha1"] }
serial_test = "3.4.0"

[package.metadata.qa]
tests = [
    # Keep serial plumbing coverage independent of workspace feature unification.
    { args = [], packages = ["gix-pathspec", "gix-ref", "gix-index", "gix-worktree", "gix-worktree-state"] },
]

[package.metadata.qa.wasm]
targets = ["wasm32-unknown-unknown", "wasm32-wasip1", "wasm32-wasip2"]
